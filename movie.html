<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブリスミックス 紹介動画</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* single light look taken from the leaflet: paper ground, navy title, brown accent */
:root{--paper:#F4EDDD; --ink:#2B2522; --ink2:#5A514A; --navy:#2C3A5C; --brown:#6E3E28;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; --sans:"Noto Sans JP","Hiragino Sans",Meiryo,sans-serif}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:24px 40px}
main{max-width:420px; margin:0 auto; display:grid; gap:14px}
h1{margin:0; font-family:var(--serif); font-weight:800; color:var(--navy); font-size:1.5rem; line-height:1.4; text-wrap:balance}
.meta{margin:0; font-size:.85rem; color:var(--ink2)}
video{display:block; width:100%; max-width:100%; aspect-ratio:9/16; background:#111; border-radius:6px}
.note{margin:0; font-size:.78rem; color:var(--ink2); line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>ブリスミックス 紹介動画</h1>
  <p class="meta">SNS用 縦型（9:16）・約54秒・ナレーションあり</p>
  <video src="blismix_sns_1080x1920.mp4" poster="poster.jpg" controls playsinline preload="metadata" aria-label="ブリスミックス 紹介動画"></video>
  <p class="note">リーフレット（2026年11月現在）の記載内容をもとに作成した提案用サンプルです。</p>
</main>
</body>
</html>
